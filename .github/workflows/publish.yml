name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    # A release publishes to PyPI; a manual run defaults to TestPyPI.
    # Each index needs its own trusted publisher, keyed by this workflow
    # name and the environment below (pypi / testpypi).
    environment:
      name: ${{ inputs.target || 'pypi' }}
      url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/project/cliff-python/' || 'https://pypi.org/project/cliff-python/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
