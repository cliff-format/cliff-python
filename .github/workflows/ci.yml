name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out pycliff
        uses: actions/checkout@v4
        with:
          path: cliff-python

      # The specification examples and the conformance fixtures live in sibling
      # repositories. Without them the dependent tests would collect nothing.
      - name: Check out the specification
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/cliff
          path: cliff

      - name: Check out the conformance suite
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/cliff-test
          path: cliff-test

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: cliff-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: cliff-python
        run: ruff check src tests

      - name: Type check
        working-directory: cliff-python
        run: mypy

      - name: Test
        working-directory: cliff-python
        env:
          # Fail loudly if a sibling checkout is missing instead of skipping.
          CLIFF_REQUIRE_SIBLINGS: ${{ hashFiles('cliff/spec/**') != '' && '1' || '0' }}
        run: pytest

      - name: Examples are up to date
        working-directory: cliff-python
        run: python tools/regenerate_examples.py --check
